<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found</title>
    <link rel="icon" href="/portfolio.png" type="image/png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0b0c10;
        color: #c5c6c7;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .container {
        max-width: 400px;
        padding: 20px;
      }
      h1 {
        font-size: 72px;
        margin: 0 0 10px 0;
        color: #ffffff;
        background: linear-gradient(135deg, #ffffff 0%, #a5a6a7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      h2 {
        font-size: 24px;
        margin: 0 0 15px 0;
        color: #ffffff;
      }
      p {
        font-size: 16px;
        margin: 0 0 25px 0;
        line-height: 1.5;
        color: #8f9091;
      }
      a {
        display: inline-block;
        background-color: #ffffff;
        color: #0b0c10;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        transition: background-color 0.2s;
      }
      a:hover {
        background-color: #e5e6e7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for does not exist or has been moved.</p>
      <a href="/">Go Home</a>
    </div>
  </body>
</html>
